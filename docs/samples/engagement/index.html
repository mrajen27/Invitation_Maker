<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engagement photo-card samples</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.35rem; }
    h2 { margin-top: 1.75rem; color: #444; font-size: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.25rem; }
    figure { margin: 0; background: #fff; border-radius: 8px; padding: 0.6rem; box-shadow: 0 1px 6px rgba(0,0,0,.1); }
    img { width: 100%; border-radius: 4px; }
    figcaption { font-size: 0.82rem; margin-top: 0.45rem; line-height: 1.35; }
    strong { display: block; }
  </style>
</head>
<body>
  <h1>Engagement — designed WebP + photo</h1>
  <p>Photo-card templates: arch photo on top, text below. Sample: Kavin &amp; Sowmya.</p>
  <h2>Traditional</h2>
  <div class="grid">
    <figure><img src="engagement_01_with_photo.png" alt=""><figcaption><strong>01 Banana Leaf Toran</strong></figcaption></figure>
    <figure><img src="engagement_02_with_photo.png" alt=""><figcaption><strong>02 Marigold Royale</strong></figcaption></figure>
    <figure><img src="engagement_03_with_photo.png" alt=""><figcaption><strong>03 Cream Kolam Glow</strong></figcaption></figure>
  </div>
  <h2>Modern</h2>
  <div class="grid">
    <figure><img src="engagement_04_with_photo.png" alt=""><figcaption><strong>04 Teal Lantern Night</strong></figcaption></figure>
    <figure><img src="engagement_05_with_photo.png" alt=""><figcaption><strong>05 Rose Gold Vows</strong></figcaption></figure>
  </div>
</body>
</html>
