<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engagement samples — new designs</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1200px; margin: 2rem auto; padding: 0 1rem; background: #fafafa; }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.1rem; margin-top: 2rem; color: #333; }
    p { color: #444; line-height: 1.5; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    figure { margin: 0; background: #fff; border-radius: 8px; padding: 0.75rem; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    figcaption { font-size: 0.85rem; margin-top: 0.5rem; color: #333; }
    figcaption strong { display: block; }
    img { width: 100%; height: auto; border-radius: 4px; display: block; }
  </style>
</head>
<body>
  <h1>Engagement — photo + text samples</h1>
  <p>
    Five <strong>new</strong> designs (not linked from other categories): 3 traditional + 2 modern.
    Portrait in the top arch; event copy in the cream band below.
  </p>

  <h2>Traditional</h2>
  <div class="grid">
    <figure><img src="engagement_01_with_photo.png" alt=""><figcaption><strong>01 — Gopuram Gold</strong>Maroon temple, marigold toran, kolam &amp; kalash</figcaption></figure>
    <figure><img src="engagement_02_with_photo.png" alt=""><figcaption><strong>02 — Jasmine Mandapam</strong>Banana leaf, jasmine garlands, vilakku</figcaption></figure>
    <figure><img src="engagement_03_with_photo.png" alt=""><figcaption><strong>03 — Saffron Kolam</strong>Saffron glow, bells, white kolam</figcaption></figure>
  </div>

  <h2>Modern</h2>
  <div class="grid">
    <figure><img src="engagement_04_with_photo.png" alt=""><figcaption><strong>04 — Blush Minimal</strong>Blush &amp; gold frame, open text area</figcaption></figure>
    <figure><img src="engagement_05_with_photo.png" alt=""><figcaption><strong>05 — Midnight Deco</strong>Navy art-deco, light text</figcaption></figure>
  </div>
</body>
</html>
