<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engagement samples — photo + text</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1200px; margin: 2rem auto; padding: 0 1rem; background: #fafafa; }
    h1 { font-size: 1.4rem; }
    p { color: #444; line-height: 1.5; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    figure { margin: 0; background: #fff; border-radius: 8px; padding: 0.75rem; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    figcaption { font-size: 0.85rem; margin-top: 0.5rem; color: #333; }
    img { width: 100%; height: auto; border-radius: 4px; display: block; }
  </style>
</head>
<body>
  <h1>Engagement — sample with photo</h1>
  <p>
    Generated at 1080×1350 with portrait in the <strong>top arch</strong> and event copy in the
    <strong>cream band</strong>. Text safe area ends at y≈920 (above kalash/lamps in the artwork).
    With a photo, venue is one line so date, time, venue, and message fit on tighter cards.
  </p>
  <div class="grid">
    <figure><img src="engagement_01_with_photo.png" alt="Banana Leaf Toran"><figcaption>01 — Banana Leaf Toran</figcaption></figure>
    <figure><img src="engagement_02_with_photo.png" alt="Marigold Royale"><figcaption>02 — Marigold Royale</figcaption></figure>
    <figure><img src="engagement_03_with_photo.png" alt="Cream Kolam Glow"><figcaption>03 — Cream Kolam Glow</figcaption></figure>
    <figure><img src="engagement_04_with_photo.png" alt="Teal Lantern Night"><figcaption>04 — Teal Lantern Night</figcaption></figure>
    <figure><img src="engagement_05_with_photo.png" alt="Rose Gold Vows"><figcaption>05 — Rose Gold Vows</figcaption></figure>
  </div>
</body>
</html>
