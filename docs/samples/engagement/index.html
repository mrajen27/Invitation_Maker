<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engagement — reference-style samples</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1200px; margin: 2rem auto; padding: 0 1rem; background: #f5f5f5; }
    h1 { font-size: 1.35rem; }
    h2 { margin-top: 2rem; font-size: 1.05rem; color: #444; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.25rem; }
    figure { margin: 0; background: #fff; border-radius: 8px; padding: 0.6rem; box-shadow: 0 1px 6px rgba(0,0,0,.08); }
    img { width: 100%; border-radius: 4px; }
    figcaption { font-size: 0.82rem; margin-top: 0.45rem; line-height: 1.35; }
    strong { display: block; color: #222; }
  </style>
</head>
<body>
  <h1>Engagement samples (your reference board)</h1>
  <p>Scalloped gold arch · photo on top · text below. Sample: Kavin &amp; Sowmya, 29 May 2026.</p>
  <h2>Traditional</h2>
  <div class="grid">
    <figure><img src="engagement_01_with_photo.png" alt=""><figcaption><strong>01 Green Toran Gold</strong>Banana leaf, jasmine, diyas, kalash</figcaption></figure>
    <figure><img src="engagement_02_with_photo.png" alt=""><figcaption><strong>02 Marigold Royal</strong>Maroon marigold toran &amp; lamps</figcaption></figure>
    <figure><img src="engagement_03_with_photo.png" alt=""><figcaption><strong>03 Peacock &amp; Lotus</strong>Floral vines, peacock, lotus</figcaption></figure>
  </div>
  <h2>Modern</h2>
  <div class="grid">
    <figure><img src="engagement_04_with_photo.png" alt=""><figcaption><strong>04 Pink Lantern Garden</strong>Lights, roses, lanterns</figcaption></figure>
    <figure><img src="engagement_05_with_photo.png" alt=""><figcaption><strong>05 Sage Botanical Glow</strong>Sage green, bulbs, candle ring</figcaption></figure>
  </div>
</body>
</html>
